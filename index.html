<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#6366f1">
  <meta name="description" content="PocketStore: catálogo que funciona sin internet">
  <title>PocketStore</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <!-- App Shell: header -->
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="brand-icon">🛍️</div>
        <div>
          <h1>PocketStore</h1>
          <small>Tu catálogo de bolsillo</small>
        </div>
      </div>
      <span id="net" class="net">En línea</span>
    </div>
  </header>

  <!-- App Shell: contenedor principal -->
  <main>
    <div class="toolbar">
      <input id="search" class="search" type="search" placeholder="🔍 Buscar por nombre, correo o ciudad..." autocomplete="off">
      <p id="status" class="status">Cargando catálogo...</p>
    </div>

    <section id="catalog" class="grid" aria-live="polite">
      <!-- Skeletons: se ven al instante y se reemplazan con los datos -->
      <div class="skeleton"></div>
      <div class="skeleton"></div>
      <div class="skeleton"></div>
      <div class="skeleton"></div>
    </section>
  </main>

  <!-- App Shell: footer -->
  <footer class="footer">PocketStore · Funciona sin internet ⚡</footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
